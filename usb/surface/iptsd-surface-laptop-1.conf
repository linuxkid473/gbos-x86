# Surface Laptop 1 (2017), IPTS touchscreen 1B96:0979, EDS v1.
# EDS v1 does not report screen dimensions. This matches IPTSD's upstream
# Surface Laptop 1+2 preset for this exact HID ID: no X/Y inversion and
# 28.53 x 19.02 cm active area. Confirm edge alignment on the physical panel.
[Config]
InvertX = false
InvertY = false
Width = 28.53
Height = 19.02
