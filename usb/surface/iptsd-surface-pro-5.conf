# iptsd config for the Surface Pro 5 (2017) touchscreen (IPTS 1B96:001F), loaded by iptsd-run.sh through IPTSD_CONFIG_FILE.
# The values of iptsd's own preset etc/presets/surface-pro-5.conf (alex-lentz/iptsd @ 3663e96e, from linux-surface/iptsd).
# Its [Device] section, which only selects the preset, is not needed here: iptsd-run.sh picks this file by the device's id.
[Config]
InvertX = true
InvertY = true

Width = 25.98
Height = 17.32
