# gbOS86 boot options (shell syntax, edit on any computer)
# SHELL_AT: none | early (before drivers) | pre_android (Android root mounted at /new)
SHELL_AT=none
# Load i915 graphics driver: auto (default: dynamic hardware coldplug via modalias), 1 (force i915), 0 (disable).
LOAD_I915=auto
# Load Intel Wi-Fi driver (firmware is not packaged yet, so it will likely complain)
LOAD_WIFI=0
# Seconds to pause before handing over to Android init (time to read the screen)
EXTRA_SLEEP=0
# MODE: what booting this USB does.
#   ask     show the gbOS86 menu: live / install-or-update / boot the installed system (default)
#   live    run gbOS86 live from the USB (nothing saved)
#   install go straight to the installer/updater (it asks before erasing anything)
#   boot    boot the installed system if there is one, else live
MODE=ask
# Display density (dpi). auto (default) calculates optimal scaling from screen resolution. Unset = Google's stock 260.
DENSITY=auto
# Make everything smaller WITHOUT changing density: Android renders at this size and the display
# scales it to the 1920x1080 panel. Bigger = smaller UI (2400x1350 is ~20% smaller, 2880x1620 ~33%).
# Empty = native 1920x1080. Keep 16:9. Takes effect after an update boot.
RESOLUTION=

# Installer target: the internal NVMe or eMMC disk, or a SATA disk (M.2 SATA / 2.5") when there is no NVMe/eMMC. SD cards, USB disks and the
# stick are never targets. With more than one internal disk the installer refuses; name the one to erase here (e.g. nvme0n1, mmcblk0 or
# sda; sda is the only way to pick a SATA disk when an NVMe is also present). The serial number is still typed before anything is written.
#INSTALL_DISK=mmcblk0
# GBOS_INSTALL_MODE: when the target disk already has partitions the installer asks "1) Dual-Boot (keep them, add gbOS86 in the free space) or
# 2) Full clean install (erase the disk)". Set dualboot or clean to answer that question here. The serial number is typed either way.
#GBOS_INSTALL_MODE=dualboot

# REQUIRE_AVX=1 (default): stop with a message when the CPU has no AVX2 (Google's init dies on its first instruction there,
# otherwise a SIGILL / kernel panic). 0 = boot anyway.
REQUIRE_AVX=1

# GPU_SOFTWARE=auto (default): render on the CPU when the laptop has no Intel GPU (AMD Radeon / Ryzen): Google's image only has
# an Intel graphics driver, so hook.sh swaps in SwiftShader (a CPU Vulkan driver) and a libgbm that can allocate buffers on amdgpu.
# Slow (the CPU draws everything) but it shows a desktop. Never changes anything on an Intel laptop in auto mode.
# 1 = use it even on an Intel GPU (for testing), 0 = never. Logged as "hook: software rendering: ..." in logs/boot-N.
GPU_SOFTWARE=auto

# GPU_VULKAN=auto (default): on an AMD GPU (amdgpu bound), use RADV (Mesa's AMD Vulkan driver, usb/patched/vulkan.radv.so, built by
# tools/radv-android/build.sh) when the stick has it, else SwiftShader. radv / swiftshader force one. If the screen stays black on an AMD
# laptop with RADV, try GPU_VULKAN=swiftshader. Logged as "hook: software rendering: Vulkan driver (...)" in logs/boot-N.
GPU_VULKAN=auto

# KSU_MANAGER=1 (default): install KernelSU's manager app on the first boot (the kernel has
# KernelSU built in; the app is what grants root to other apps). 0 = don't install it.
KSU_MANAGER=1

# HWDETECT=1 (default): at boot, detect the laptop's hardware and load the matching drivers from gbos/modules with
# firmware from gbos/firmware (Wi-Fi, Bluetooth, sound, touchpad, hotkeys, brightness, ...). Report: logs/boot-N/hwdetect.txt.
# Set 0 for the original Latitude 5300 sequence (iwlmvm + btusb from the stick, no gbos/modules coldplug).
HWDETECT=1

# Experimental 7320-only HID accelerometer Sensors HAL trial. The hook verifies exact DMI identity
# and leaves the stock HAL selected on other devices. SENSOR_HAL=0 disables this trial.
SENSOR_HAL=1
# Latitude 7320 adaptive brightness (needs SENSOR_HAL=1 for the light sensor): overlay + panel curve from gbos/display/.
# 0 = leave Google's setting (adaptive brightness unavailable). The Settings toggle itself is the user's.
ADAPTIVE_BRIGHTNESS=1

# Latitude 7320 Detachable tablet mode (DMI-gated; log: logs/boot-N/tablet-mode.txt).
# TABLET_SWITCH: intel_hid enable_sw_tablet_mode, 2 (default) = read the switch at probe, 1 = after the first switch
#   event, 0 = kernel auto mode (no switch on this laptop).
# TABLET_KEYBOARD: ime (default) = show the on-screen keyboard while the cover is detached (show_ime_with_hard_keyboard),
#   unbind = detach the EC keyboard (atkbd) instead, 0 = off. TABLET_MODE=0 turns the whole helper off.
# ROTATION_OVERRIDE=1 also sets config.override_forced_orient (affects external displays too; off by default).
#TABLET_SWITCH=2
#TABLET_KEYBOARD=ime
#ROTATION_OVERRIDE=1

# Experimental 7320 live-USB-only raw camera test, off by default. Records metadata/errors
# in camera-capture.txt, not image content. A watchdog timeout can require a live reboot.
#CAMERA_CAPTURE_PROBE=1
# Select exactly one sensor per live boot: ov5675 (front, default) or ov8856 (rear).
#CAMERA_CAPTURE_SENSOR=ov5675

# Experimental Latitude 7320 IPU6-to-loopback camera bridge. It is DMI-gated and off
# by default; it keeps the sensor streaming until reboot because firmware stop is not
# yet reliable. Test images can opt in without changing this source config.
CAMERA_BRIDGE=0
# Latitude 7320 front camera A/B test: 1 makes ov5675.ko write the Windows driver's values for
# this module (0x5000=0x71, 0x3d8c=0x71, 0x3d8d=0xe7) at stream start; 0 keeps the Linux table.
OV5678_WINDOWS_ISP=0
# With CAMERA_BRIDGE=1 the rear OV8856 runs too (second bridge, /dev/video65, listed as the back
# camera). CAMERA_REAR=0 keeps the front only. CAMERA_REAR_ROTATION=180 turns the rear picture.
#CAMERA_REAR=0
#CAMERA_REAR_ROTATION=180
# CAMERA_LIBCAMERA=1 (experimental): the rear goes through Google's libcamera camera HAL with the gbOS plugin
# (gbos_ipu6.so) instead of the USB HAL: one camera serving several stream sizes at once, 4:3 stills up to
# 1920x1440. CAMERA_LIBCAMERA=test shows the plugin test camera (colour bars) as the rear instead.
#CAMERA_LIBCAMERA=1

# DEBUG_LOGS=1 enables rotating full logcat, KMS debug, and delayed audio/display/AI diagnostics.
# Crash logs, kernel logs, and focused camera/sensor diagnostics remain enabled when this is 0.
DEBUG_LOGS=0
# With DEBUG_LOGS=1 the first 10 minutes also go to logcat-boot.txt (kept, not rotated away). Both logcat files leave out
# pixel-thermal's INFO lines and keystore2's RKP/TEE errors; LOGCAT_FULL=1 keeps them.
#LOGCAT_FULL=1
# drm_hwcomposer logs are capped at WARN (it logs a VERBOSE line per frame on i915). DRMHWC_VERBOSE=1 keeps the vendor level.
#DRMHWC_VERBOSE=1
# The power HAL's GPU interrupt hint: on i915, /dev/power/irq-by-name/xe is linked to i915's interrupt (vendor links it only for xe).
# GPU_IRQ_LINK=0 leaves it out.
#GPU_IRQ_LINK=0
# Google's init.lapis.rc writes its own laptop's CPU power limits (PL1 25 W, PL2 55 W); they are removed so the
# firmware's limits apply. KEEP_LAPIS_POWER_LIMITS=1 keeps Google's values.
#KEEP_LAPIS_POWER_LIMITS=1
# KVM_TRACE=1 records Trusty VM exits to kvmtrace.txt; this can write tens of megabytes per boot.
KVM_TRACE=0

# SKIP_SETUP=1 (default): skip Google SetupWizard and the OTA update loop on initial boot, launching
# directly to the desktop. Recommended on generic PCs where official Google OTA updates fail and trap
# the setup wizard (Issue #24). Set 0 to run stock Google SetupWizard.
SKIP_SETUP=1

# Driver options, as on a Linux kernel command line but for modules only: "module.param=value", space separated. They are applied
# when hwdetect loads the module (before it would load without them). Temporary Wi-Fi diagnostic for MSI Modern 15 B7M (MT7922,
# PCI 14c3:0616): the driver Oopsed while parsing CLC data from firmware; disable only that optional CLC path. This may restrict
# regulatory/channel configuration. Remove this setting after testing. Other examples: xe.enable_panel_replay=0.
MODOPTS="mt7921_common.disable_clc=1"
# The parameters a driver has are listed in logs/boot-N/hwdetect.txt ("== xe parameters").

# Speaker or headphone jack silent because the BIOS declares the wrong HD-audio pins (what hdajackretask or a kernel pin quirk
# fixes on Linux): "NID=CONFIG" pairs, space separated, applied to the analog codec before Android starts. The pins and their
# current values are in logs/boot-N/hwdetect.txt ("== sound codecs", "Pin Default"). Prefix "hwC0D0:" to pick one codec.
# Example (Infinix INBOOK X3 Slim: 0x14 unused, speaker on 0x1b):
#HDA_PINS="0x14=0x411111f0 0x1b=0x90170110"

# Update speed: the system image, firmware and modules are skipped when unchanged since the last verified copy (a quick update
# takes about a minute). UPDATE_FULL=1 forces the full compare, copy and verify of everything (~10 minutes).
#UPDATE_FULL=1

# System updates without the stick (docs/system-update.md): a signed bundle copied into gbos/update.inbox/ on the installed system is
# checked and switched in at the next start, and rolled back after SYSUPDATE_ATTEMPTS starts that do not reach the desktop (default 3).
# SYSUPDATE=0: do not look at update.inbox (an update already in progress still finishes or rolls back).
#SYSUPDATE=0
#SYSUPDATE_ATTEMPTS=3

# TRUSTY_VM=1 keeps Google's Trusty security VM running after boot. It never answers here (software KeyMint/Gatekeeper replace it)
# and spins one CPU core at 100%, so by default it is stopped at boot_completed. Only for debugging.
#TRUSTY_VM=1

# RUN_SH_BACKCHANNEL=1 (debug only, default off): a gbos/run.sh put on this volume is moved into the boot's log directory at boot, and
# Android runs it there as root (output in logs/boot-N/run.log, then deleted). Only when that directory is root-only (not with POSTINSTALL_RW=1).
#RUN_SH_BACKCHANNEL=1

# POSTINSTALL_RW=1 (debug only, default off): Android sees this volume (/postinstall) writable by every app, as before 2026-11-19. Android runs
# root code from it, so while this is on any app can get root. By default it is read-only for Android, apart from the boot's log directory,
# which only root can reach.
#POSTINSTALL_RW=1

# TOUCHPAD_FLICK=0 turns off the touchpad fix: Android ignores the first 200 ms of every touch on a touchpad without its own IDC file,
# so quick flicks do nothing. By default each internal touchpad gets an IDC file with Change_Timeout=0.02. Takes effect after a boot.
#TOUCHPAD_FLICK=0

# FINGERPRINT=0 disables the experimental Goodix MOC AIDL HAL. By default the HAL is enabled only for USB 27c6:6384.
# Requires the fingerprint HAL binary produced by build.sh. Takes effect after a boot.
FINGERPRINT=1

# Bind the SHA-NI/VNNI-free libz + libcrypto before stage0's dmctl runs (saves ~2 s of trapped SHA at boot).
# Harmless if the file is missing; hook.sh patches later anyway.
[ -f /gbos/gbos/early_patch.sh ] && . /gbos/gbos/early_patch.sh

# XE_PARAMS: module parameters for the xe graphics driver (Lunar Lake and newer; older Intel GPUs use i915), loaded before the
# coldplug. On the Surface Laptop 7 the screen showed ghost images ("3D glasses") and froze: the log had "Selective fetch area
# calculation failed in pipe A" (PSR2) followed by "CPU pipe A FIFO underrun". "enable_psr=0 enable_fbc=0" fixed it. Unset = defaults.
#XE_PARAMS="enable_psr=0 enable_fbc=0"

# DEVICE_MODEL: name shown as "Model" and "Device name" in Settings > About (ro.product.model / ro.product.marketname, and
# Settings.Global.device_name set after boot). Unset = Google's own. Only the model strings change, not the build fingerprint.
#DEVICE_MODEL="Surface Laptop 7"

# ACCESSIBILITY=talkback: switch Google's TalkBack screen reader on at the first Android boot (with the Google TTS engine in the image it speaks
# straight away). Done once per /data, so you can still turn it off in Settings; in live mode (nothing saved) it is on every boot. Unset = off.
#ACCESSIBILITY=talkback

# Stage0 screen reader (Speakup + espeakup, folder gbos/a11y/): the boot menu and the installer are spoken through the speakers when the
# folder is on the stick and the laptop's sound card is a legacy Intel HDA one. A11Y=0 turns it off. A11Y_MENU_TIMEOUT=N: seconds the
# boot menu waits for a key (default 60 with speech, 15 without). Speech needs a kernel with Speakup (gbOS86 kernel #46 and newer).
#A11Y=0
#A11Y_MENU_TIMEOUT=60

# The gbos FAT volume (this stick, or an installed system's GBOSSYS) is remounted read-only at the end of every shutdown/reboot, so the next
# boot finds it clean (usb/stick_fat.sh). FAT_SHUTDOWN_RO=0 turns that off. At boot, logs/boot-N/fat-check.txt and the "FAT-CHECK" line in
# stage0-dmesg.txt say whether the previous shutdown was clean and how the previous boot's shutdown step ended (its fat-shutdown.txt).
# FAT_FSCK=auto (default): when it was not clean, run a read-only fsck.fat -n; 1 = every boot, 0 = never. If fsck finds nothing but the
# "not properly unmounted" flag (and lost clusters, which only waste space), the flag is cleared at shutdown, right after the read-only
# remount (FAT_CLEAR_DIRTY=0 keeps it); anything else is only reported: repair it on another computer (Windows: chkdsk X: /f, macOS: Disk
# Utility First Aid). FAT_SHUTDOWN_SYSRQ=0: no emergency remount (sysrq u) when the normal remount keeps failing with EBUSY.
# BOOTDISK_RAM=0: the boot HAL's fake boot disk loops gbos/bootdisk.img on the volume instead of a RAM copy (detached at shutdown).
#FAT_SHUTDOWN_RO=1
#FAT_FSCK=auto
#FAT_CLEAR_DIRTY=1
# One kind of damage is repaired at boot: a log file under gbos/logs/boot-N that a forced power-off left longer than its data
# ("File size is X bytes, cluster chain length is Y bytes"). It is cut to its data, as chkdsk would, and fsck runs again; only when that
# was the only problem. FAT_REPAIR_LOGS=0 only reports it.
#FAT_REPAIR_LOGS=1
# Every FAT_SYNC_S seconds the volume's directory entries and FAT are written out (syncfs), so a forced power-off keeps the logs written
# up to then, including the logcat files rotated during the boot. 0 = off.
#FAT_SYNC_S=30
# Before each of those syncs one status line goes to logs/boot-N/fat-heartbeat.txt (uptime, kmsg.log's size, whether the kernel-log
# copier runs, read-only or not, new FAT/I/O/USB-reset kernel lines); the shutdown step adds the same to fat-shutdown.txt. 0 = off.
#FAT_HEARTBEAT=1
#FAT_SHUTDOWN_SYSRQ=1
#BOOTDISK_RAM=1
