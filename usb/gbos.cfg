# gbOS86 boot options (shell syntax, edit on any computer)
# SHELL_AT: none | early (before drivers) | pre_android (Android root mounted at /new)
SHELL_AT=none
# Load i915 graphics driver: auto (default: auto-detects between i915 and xe), 1 (force i915), 0 (disable).
LOAD_I915=auto
if [ "$LOAD_I915" = "auto" ]; then
  LOAD_I915=0
  for _pci in /sys/bus/pci/devices/*; do
    [ -e "$_pci/class" ] || continue
    case "$(cat $_pci/class 2>/dev/null)" in
      0x03*)
        if [ "$(cat $_pci/vendor 2>/dev/null)" = "0x8086" ]; then
          _dev_id=$(cat $_pci/device 2>/dev/null | sed 's/^0x//')
          case "$_dev_id" in
            7d[0-9a-f][0-9a-f]|64[0-9a-f][0-9a-f]|b6[0-9a-f][0-9a-f]|56[0-9a-f][0-9a-f]|e2[0-9a-f][0-9a-f])
              LOAD_I915=0 ;;
            *)
              LOAD_I915=1 ;;
          esac
        fi
        ;;
    esac
  done
  unset _pci _dev_id
fi
# Load Intel Wi-Fi driver (firmware is not packaged yet, so it will likely complain)
LOAD_WIFI=0
# Seconds to pause before handing over to Android init (time to read the screen)
EXTRA_SLEEP=0
# MODE: what booting this USB does.
#   ask     show the gbOS86 menu: live / install-or-update / boot the installed system (default)
#   live    run gbOS86 live from the USB (nothing saved)
#   install go straight to the installer/updater (it asks before erasing anything)
#   boot    boot the installed system if there is one, else live
MODE=ask
# Display density (dpi). auto (default) calculates optimal scaling from screen resolution. Unset = Google's stock 260.
DENSITY=auto
# Make everything smaller WITHOUT changing density: Android renders at this size and the display
# scales it to the 1920x1080 panel. Bigger = smaller UI (2400x1350 is ~20% smaller, 2880x1620 ~33%).
# Empty = native 1920x1080. Keep 16:9. Takes effect after an update boot.
RESOLUTION=

# Installer target: the internal NVMe or eMMC disk, or a SATA disk (M.2 SATA / 2.5") when there is no NVMe/eMMC. SD cards, USB disks and the
# stick are never targets. With more than one internal disk the installer refuses; name the one to erase here (e.g. nvme0n1, mmcblk0 or
# sda; sda is the only way to pick a SATA disk when an NVMe is also present). The serial number is still typed before anything is written.
#INSTALL_DISK=mmcblk0
# GBOS_INSTALL_MODE: when the target disk already has partitions the installer asks "1) Dual-Boot (keep them, add gbOS86 in the free space) or
# 2) Full clean install (erase the disk)". Set dualboot or clean to answer that question here. The serial number is typed either way.
#GBOS_INSTALL_MODE=dualboot

# REQUIRE_AVX=1 (default): stop with a message when the CPU has no AVX2 (Google's init dies on its first instruction there,
# otherwise a SIGILL / kernel panic). 0 = boot anyway.
REQUIRE_AVX=1

# GPU_SOFTWARE=auto (default): render on the CPU when the laptop has no Intel GPU (AMD Radeon / Ryzen): Google's image only has
# an Intel graphics driver, so hook.sh swaps in SwiftShader (a CPU Vulkan driver) and a libgbm that can allocate buffers on amdgpu.
# Slow (the CPU draws everything) but it shows a desktop. Never changes anything on an Intel laptop in auto mode.
# 1 = use it even on an Intel GPU (for testing), 0 = never. Logged as "hook: software rendering: ..." in logs/boot-N.
GPU_SOFTWARE=auto

# GPU_VULKAN=auto (default): on an AMD GPU (amdgpu bound), use RADV (Mesa's AMD Vulkan driver, usb/patched/vulkan.radv.so, built by
# tools/radv-android/build.sh) when the stick has it, else SwiftShader. radv / swiftshader force one. If the screen stays black on an AMD
# laptop with RADV, try GPU_VULKAN=swiftshader. Logged as "hook: software rendering: Vulkan driver (...)" in logs/boot-N.
GPU_VULKAN=auto

# KSU_MANAGER=1 (default): install KernelSU's manager app on the first boot (the kernel has
# KernelSU built in; the app is what grants root to other apps). 0 = don't install it.
KSU_MANAGER=1

# HWDETECT=1 (default): at boot, detect the laptop's hardware and load the matching drivers from gbos/modules with
# firmware from gbos/firmware (Wi-Fi, Bluetooth, sound, touchpad, hotkeys, brightness, ...). Report: logs/boot-N/hwdetect.txt.
# Set 0 for the original Latitude 5300 sequence (iwlmvm + btusb from the stick, no gbos/modules coldplug).
HWDETECT=1

# SKIP_SETUP=1 (default): skip Google SetupWizard and the OTA update loop on initial boot, launching
# directly to the desktop. Recommended on generic PCs where official Google OTA updates fail and trap
# the setup wizard (Issue #24). Set 0 to run stock Google SetupWizard.
SKIP_SETUP=1

# Driver options, as on a Linux kernel command line but for modules only: "module.param=value", space separated. They are applied
# when hwdetect loads the module (before it would load without them). Temporary Wi-Fi diagnostic for MSI Modern 15 B7M (MT7922,
# PCI 14c3:0616): the driver Oopsed while parsing CLC data from firmware; disable only that optional CLC path. This may restrict
# regulatory/channel configuration. Remove this setting after testing. Other examples: xe.enable_panel_replay=0.
MODOPTS="mt7921_common.disable_clc=1"
# The parameters a driver has are listed in logs/boot-N/hwdetect.txt ("== xe parameters").

# Update speed: the system image, firmware and modules are skipped when unchanged since the last verified copy (a quick update
# takes about a minute). UPDATE_FULL=1 forces the full compare, copy and verify of everything (~10 minutes).
#UPDATE_FULL=1

# TRUSTY_VM=1 keeps Google's Trusty security VM running after boot. It never answers here (software KeyMint/Gatekeeper replace it)
# and spins one CPU core at 100%, so by default it is stopped at boot_completed. Only for debugging.
#TRUSTY_VM=1

# TOUCHPAD_FLICK=0 turns off the touchpad fix: Android ignores the first 200 ms of every touch on a touchpad without its own IDC file,
# so quick flicks do nothing. By default each internal touchpad gets an IDC file with Change_Timeout=0.02. Takes effect after a boot.
#TOUCHPAD_FLICK=0

# Bind the SHA-NI/VNNI-free libz + libcrypto before stage0's dmctl runs (saves ~2 s of trapped SHA at boot).
# Harmless if the file is missing; hook.sh patches later anyway.
[ -f /gbos/gbos/early_patch.sh ] && . /gbos/gbos/early_patch.sh

# XE_PARAMS: module parameters for the xe graphics driver (Lunar Lake and newer; older Intel GPUs use i915), loaded before the
# coldplug. On the Surface Laptop 7 the screen showed ghost images ("3D glasses") and froze: the log had "Selective fetch area
# calculation failed in pipe A" (PSR2) followed by "CPU pipe A FIFO underrun". "enable_psr=0 enable_fbc=0" fixed it. Unset = defaults.
#XE_PARAMS="enable_psr=0 enable_fbc=0"

# DEVICE_MODEL: name shown as "Model" and "Device name" in Settings > About (ro.product.model / ro.product.marketname, and
# Settings.Global.device_name set after boot). Unset = Google's own. Only the model strings change, not the build fingerprint.
#DEVICE_MODEL="Surface Laptop 7"
