# tools/release.sh settings shared by every maintainer (commit changes). This computer's paths: tools/release.sh setup.
#
# START: the oldest published update whose laptops get a small download (delta) from the next release; laptops on an older one get
# the full bundle. Set it with `tools/release.sh start VALUE`: a date (2026-11-20 = the first update published that day or later),
# an update number (202611201230), last (only the newest) or all.
START=all
# BRANCH: releases are made only from this branch, as it is on the day tools/release.sh runs.
BRANCH=main
# REPO: the only repository releases go to (the project's main repository; never a fork or the lab repository).
REPO=linuxkid473/gbos-x86
